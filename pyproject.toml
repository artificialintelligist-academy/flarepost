[project]
name = "flarepost"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javier Blanco", email = "107069387+javierblancodev@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3,<3",
    "pydantic>=2.14.3",
]

[project.scripts]
flarepost = "flarepost:main"
flarepost-seed = "flarepost.seed:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
